name: Publish to PyPI

# Uses PyPI's Trusted Publisher mechanism (OIDC) -- no API token secret needed. Configure it once
# on the PyPI project's "Publishing" settings page, pointing at this repo/workflow/environment.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
